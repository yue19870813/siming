[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/siming-cli",
  "crates/siming-core",
  "crates/siming-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sunyingyingmu/Siming"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siming-core = { path = "crates/siming-core" }
siming-storage = { path = "crates/siming-storage" }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
