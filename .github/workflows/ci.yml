name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and frontend
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p siming-cli -- --version
      - name: CLI delivery smoke test
        run: |
          cargo run -p siming-cli -- validate fixtures/minimal-project --format json
          cargo run -p siming-cli -- export fixtures/minimal-project --output /tmp/siming-runtime-a
          cargo run -p siming-cli -- export fixtures/minimal-project --output /tmp/siming-runtime-b
          diff -r /tmp/siming-runtime-a /tmp/siming-runtime-b
          node examples/runtime-reader/index.mjs /tmp/siming-runtime-a intro zh-CN

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri -- build
        working-directory: apps/desktop
      - run: cargo build --release -p siming-cli
      - run: cargo run -p siming-cli -- validate fixtures/minimal-project
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: siming-desktop-${{ runner.os }}
          path: target/release/bundle/**
          if-no-files-found: error
      - name: Upload standalone CLI
        uses: actions/upload-artifact@v4
        with:
          name: siming-cli-${{ runner.os }}
          path: |
            target/release/siming
            target/release/siming.exe
          if-no-files-found: ignore
